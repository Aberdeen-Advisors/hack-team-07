name: Bridge ingest

# Turns dropped sources into register entries, on a schedule, with no laptop involved.
#
# Runs with ZERO secrets. scripts/extract.py does pattern-based extraction over
# data/inbox/transcripts/ — no API key, no Slack token, no network.
#
# Optional secrets, in Settings → Secrets and variables → Actions:
#   ANTHROPIC_API_KEY       upgrades extraction to a real Claude pass over the same inputs
#   VERCEL_DEPLOY_HOOK_URL  Vercel → Project → Settings → Git → Deploy Hooks; publishes each run
#   SLACK_BOT_TOKEN         reads the channel directly instead of committed files (needs
#                           channels:history, groups:history, files:read on a workspace app)

on:
  schedule:
    - cron: '0,30 13-22 * * 1-5'   # every 30 min, 9am-6pm ET, weekdays (cron is UTC)
  workflow_dispatch:                # a Run workflow button, for the demo
  push:
    paths:
      - 'data/inbox/**'             # a dropped transcript ingests immediately

permissions:
  contents: write                   # the job commits the updated registers

concurrency:
  group: bridge-ingest              # never two runs writing the registers at once
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    env:
      HAS_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
      HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Default path: no credentials required.
      - name: Extract — credential-free
        if: env.HAS_KEY == 'false'
        run: python3 scripts/extract.py

      # Upgrade path: same inputs, same output contract, better judgement.
      - name: Extract — Claude
        if: env.HAS_KEY == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          npm install -g @anthropic-ai/claude-code
          claude -p "Follow scripts/ingest.md exactly. Ingest every file under data/inbox/ that meta.json has not recorded in ingestedFiles. Quotes must be verbatim with a correct line number. Never guess an owner or a date. Everything arrives verification.status pending. Update the registers, meta.json, data/snapshot.js and data/transcripts.js. Do not touch index.html. Write a two-line summary to ingest-report.txt." \
            --allowedTools "Read,Write,Edit,Bash,Glob,Grep" --permission-mode acceptEdits

      - name: Verify nothing is broken
        run: |
          node --check data/snapshot.js
          if [ -f data/transcripts.js ]; then node --check data/transcripts.js; fi
          python3 - <<'EOF'
          import json,glob,sys
          for f in glob.glob('data/*.json'):
              try: json.load(open(f,encoding='utf-8'))
              except Exception as e: print("INVALID",f,e); sys.exit(1)
          print("all register files parse")
          EOF
          if grep -q 'fetch(' index.html; then echo "index.html regained a fetch call"; exit 1; fi
          echo "gate passed"

      - name: Commit the registers
        run: |
          if [ -z "$(git status --porcelain data)" ]; then
            echo "::notice::Nothing new — registers unchanged."
            exit 0
          fi
          git config user.name  "bridge-ingest[bot]"
          git config user.email "bridge-ingest@users.noreply.github.com"
          git add data
          git commit -F - <<MSG
          ingest: update registers from dropped sources

          $(cat ingest-report.txt 2>/dev/null || echo 'no report written')
          MSG
          git push

      - name: Publish
        if: env.HOOK != ''
        run: curl -fsS -X POST "$HOOK" && echo "deploy triggered"

      - name: Report
        if: always()
        run: cat ingest-report.txt 2>/dev/null || echo "no changes this run"
